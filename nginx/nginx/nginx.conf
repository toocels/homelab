worker_processes auto;

events {
    worker_connections 1024;
    use epoll;
}

stream {
    include streams-enabled/*;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    server {
        listen 127.0.0.1:51820;
        server_name _;
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            deny all;
        }
    }

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 0;

    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    ssl_certificate     /etc/nginx/certs/toocels.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/toocels.duckdns.org/privkey.pem;

    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';

    # Docker's internal DNS — defers hostname resolution to request time, not startup.
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "no-referrer-when-downgrade";
    add_header Content-Security-Policy "upgrade-insecure-requests";

    server {
        listen 80;
        listen [::]:80;
        server_name toocels.com *.toocels.com homelab *.homelab toocels.duckdns.org *.toocels.duckdns.org toocelsts.duckdns.org *.toocelsts.duckdns.org;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name toocels.com homelab toocels.duckdns.org toocelsts.duckdns.org;
        ssl_certificate     /etc/nginx/certs/toocels.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/toocels.duckdns.org/privkey.pem;
        location / { root /etc/nginx/html; index index.html index.htm; }
    }

    server {
        listen 443 ssl;
        server_name beszel.toocels.com beszel.homelab beszel.toocels.duckdns.org beszel.toocelsts.duckdns.org;
        location / { set $upstream http://beszel:8090; proxy_pass $upstream; }
    }

    server {
        listen 443 ssl;
        server_name dockge.toocels.com dockge.homelab dockge.toocels.duckdns.org dockge.toocelsts.duckdns.org;
        location / { set $upstream http://dockge:5001; proxy_pass $upstream; }
    }

    server {
        listen 443 ssl;
        server_name immich.toocels.com immich.homelab immich.toocels.duckdns.org immich.toocelsts.duckdns.org;
        location / {
            set $upstream http://immich_server:2283;
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }
    }

    server {
        listen 443 ssl;
        server_name jellyfin.toocels.com jellyfin.homelab jellyfin.toocels.duckdns.org jellyfin.toocelsts.duckdns.org;
        location / { set $upstream http://jellyfin:8096; proxy_pass $upstream; }
    }

    server {
        listen 443 ssl;
        server_name navidrome.toocels.com navidrome.homelab navidrome.toocels.duckdns.org navidrome.toocelsts.duckdns.org;
        location / { set $upstream http://navidrome:4533; proxy_pass $upstream; }
    }

    server {
        listen 443 ssl;
        server_name nextcloud.toocels.com nextcloud.homelab nextcloud.toocels.duckdns.org nextcloud.toocelsts.duckdns.org;
        location / { set $upstream http://nextcloud:80; proxy_pass $upstream; }
    }

    server {
        listen 443 ssl;
        server_name pihole.toocels.com pihole.homelab pihole.toocels.duckdns.org pihole.toocelsts.duckdns.org;
        location / { set $upstream http://pihole:80; proxy_pass $upstream; }
    }

    server {
        listen 443 ssl;
        server_name portainer.toocels.com portainer.homelab portainer.toocels.duckdns.org portainer.toocelsts.duckdns.org;
        location / { set $upstream http://portainer:9000; proxy_pass $upstream; }
    }

    server {
        listen 443 ssl;
        server_name rewind.toocels.com rewind.homelab rewind.toocels.duckdns.org rewind.toocelsts.duckdns.org;
        location / { set $upstream http://rewind:4000; proxy_pass $upstream; }
    }

    server {
        listen 443 ssl;
        server_name vaultwarden.toocels.com vaultwarden.homelab vaultwarden.toocels.duckdns.org vaultwarden.toocelsts.duckdns.org;
        location / { set $upstream http://vaultwarden:80; proxy_pass $upstream; }
    }
}
