<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Homelab</title>
  <link rel="icon" type="image/svg+xml" href="https://self-hosted.directory/logo.svg">
  <style>
    html {
      color-scheme: light dark;
    }

    body {
      max-width: 40em;
      margin: 0 auto;
      padding: 0 1em;
      box-sizing: border-box;
      font-family: Tahoma, Verdana, Arial, sans-serif;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 20px;
    }

    a.button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px;
      text-align: center;
      text-decoration: none;
      border: 1px solid #888;
      border-radius: 6px;
      color: inherit;
      transition: transform 0.3s;
    }

    a.button img {
      width: 20px;
      height: 20px;
    }

    a.button:hover {
      background-color: rgba(128, 128, 128, 0.2);
      transform: scale(1.05);
    }

    @media (max-width: 600px) {
      body {
        font-size: 15px;
      }

      h1 {
        font-size: 1.4em;
      }
    }

    @media (max-width: 420px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <h1>Welcome to my homelab</h1>
  <p>Click any of these services to get started and access them.</p>

  <div class="grid">
    <script>
      const h = location.hostname;

      document.write(`
    <a class="button" href="https://jellyfin.${h}"><img src="icons/jellyfin.ico"> Jellyfin</a>
    <a class="button" href="https://nextcloud.${h}"><img src="icons/nextcloud.png"> Nextcloud</a>
    <a class="button" href="https://pihole.${h}/admin"><img src="icons/pihole.png"> Pi-hole</a>
    <a class="button" href="https://vaultwarden.${h}"><img src="icons/vaultwarden.svg"> Vaultwarden</a>
    <a class="button" href="https://immich.${h}"><img src="icons/immich.ico"> Immich</a>
    <a class="button" href="https://navidrome.${h}"><img src="icons/navidrome.ico"> Navidrome</a>
    <a class="button" href="https://rewind.${h}"><img src="icons/rewind.ico"> Rewind</a>
    <a class="button" href="https://beszel.${h}"><img src="icons/beszel.svg"> Beszel</a>
    <a class="button" href="https://dockge.${h}"><img src="icons/dockge.svg"> Dockge</a>
    <a class="button" href="https://toocels-web.${h}"><img src="https://toocels-web.${h}/images/awesome-circle.png"> Toocels Web</a>
  `);
    </script>
  </div>

</body>

</html>
