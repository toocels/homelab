
services:
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    user: "${PUID}:${PGID}"
    # ports:
    #   - ":8080:80"
    volumes:
      - ./data:/srv
      - ./database:/database
      - ./config:/config
    restart: always
    networks:
      - homeharbour

  samba:
    image: dperson/samba
    container_name: samba
    environment:
      - USERID=${PUID}
      - GROUPID=${PGID}
    command: '-u "${SAMBA_USER};${SAMBA_PASSWORD}" -p -s "data;/share;yes;no;no;${SAMBA_USER};;${SAMBA_USER}"'
    # ports:
    #   - "445:445"
    volumes:
      - ./data:/share
    restart: always
    networks:
      - homeharbour

networks:
  homeharbour:
    external: true
