
services:
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    # ports:
    #   - "127.0.0.1:8080:80"
    volumes:
      - ./data:/srv
      - ./database:/database
      - ./config:/config
    restart: always
    networks:
      - homeharbour

networks:
  homeharbour:
    external: true
