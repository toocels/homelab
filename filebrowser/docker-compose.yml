
services:
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    # ports:
    #   - "127.0.0.1:8080:80"
    volumes:
      - ./data:/srv
      - ./database:/database
      - ./config:/config
    restart: always
    networks:
      - homeharbour

  samba:
    image: dperson/samba
    container_name: samba
    command: '-u "${SAMBA_USER};${SAMBA_PASSWORD}" -p -s "data;/share;yes;no;no;${SAMBA_USER};${SAMBA_USER};${SAMBA_USER}"'
    ports:
      - "445:445"
    #   - "139:139"
    volumes:
      - ./data:/share
    restart: always
    networks:
      - homeharbour

networks:
  homeharbour:
    external: true
