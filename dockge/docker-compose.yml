services:
  dockge:
    image: louislam/dockge:1
    container_name: dockge
    restart: unless-stopped
    # ports:
    #   - "127.0.0.1:5001:5001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./dockge_data:/app/data
      - /mnt/Storage/ie/programming/dockers:/mnt/Storage/ie/programming/dockers
    environment:
      DOCKGE_STACKS_DIR: /mnt/Storage/ie/programming/dockers
    networks:
      - homelab
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5001/"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  homelab:
    external: true
